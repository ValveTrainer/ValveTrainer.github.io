<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181c">
<meta name="description" content="Plant Trainer: free, offline-capable training support for manufacturing plant operators. Pressure, DP, P&IDs, pumps, valves, vacuum, filtration, LOTO.">
<title>Plant Trainer · Free operator training</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to lesson</a>
<header class="topbar">
  <a href="#/home" class="brand" aria-label="Plant Trainer home"><span class="brand-mark" aria-hidden="true">&#9881;</span> Plant Trainer</a>
  <span class="badge">Free operator training</span>
  <span class="topbar-spacer"></span>
  <button id="mentorToggle" class="btn btn-mentor" type="button" aria-controls="mentor" aria-expanded="false">&#128172; Plant Mentor</button>
</header>

<div class="layout" id="layout">
  <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>
  <main id="main" class="main" tabindex="-1"></main>
  <aside id="mentor" class="mentor" aria-label="Plant Mentor">
    <div class="mentor-head">
      <h2>&#128172; Plant Mentor</h2>
      <button id="mentorClose" class="btn btn-small" type="button" aria-label="Close Plant Mentor">Close</button>
    </div>
    <div id="mentorLog" class="mentor-log" aria-live="polite"></div>
    <form id="mentorForm" class="mentor-form" autocomplete="off">
      <label for="mentorInput" class="sr-only">Ask Plant Mentor a question</label>
      <input id="mentorInput" type="text" placeholder="Ask a plant question…" enterkeyhint="send">
      <button class="btn btn-amber" type="submit">Ask</button>
    </form>
    <div class="mentor-grok"><button id="mentorGrok" class="btn btn-small" type="button" title="Copies a prompt to paste into your Grok bot. No internet call from this app.">&#128203; Ask Grok (copy prompt)</button></div>
    <p class="mentor-note">Answers come from the built-in notes on this device. No internet needed.</p>
  </aside>
</div>

<footer class="footer">Training support only. Follow your plant's P&amp;IDs, permits, and LOTO.</footer>

<nav class="bottombar" aria-label="Quick navigation">
  <button type="button" data-nav="home">&#8962;<span>Home</span></button>
  <button type="button" data-nav="sections">&#9776;<span>Sections</span></button>
  <button type="button" data-nav="mentor">&#128172;<span>Mentor</span></button>
  <button type="button" data-nav="check">&#10003;<span>Check</span></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
